<div class="app-layout">

  <!-- MOBILE TOPBAR (Visible only on mobile <= 768px) -->
  <header class="mobile-topbar">
    <div class="mobile-logo">
      <div class="logo-icon-badge-sm">✨</div>
      <div class="mobile-logo-text">
        <span class="mobile-brand-title">Niju's Dashboard</span>
      </div>
    </div>

    <div class="mobile-top-right">
      <span class="mobile-date-badge">📅 {{ todayDate | date:'d MMM y' }}</span>
      <button class="mobile-logout-btn" (click)="logout()" title="Logout">
        🚪
      </button>
    </div>
  </header>

  <!-- DESKTOP SIDEBAR (Visible on screens > 768px) -->
  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon-badge">✨</div>
      <div class="logo-text">
        <h2>Personal<span>App</span></h2>
        <span class="logo-sub">Niju's Dashboard</span>
      </div>
    </div>

    <!-- Today's Date Badge in Sidebar -->
    <div class="sidebar-date-box">
      <span class="date-icon">📅</span>
      <div class="date-details">
        <span class="date-label">Today's Date</span>
        <strong class="date-value">{{ todayDate | date:'EEE, d MMM y' }}</strong>
      </div>
    </div>

    <nav class="menu">

      <a routerLink="/layout/dashboard"
         routerLinkActive="active"
         class="menu-item">
        <span class="menu-icon">🏠</span>
        <span>Dashboard</span>
      </a>

      <a routerLink="/layout/jobs"
         routerLinkActive="active"
         class="menu-item">
        <span class="menu-icon">💼</span>
        <span>Jobs</span>
      </a>

      <a routerLink="/layout/savings"
         routerLinkActive="active"
         class="menu-item">
        <span class="menu-icon">💰</span>
        <span>Savings</span>
      </a>

      <a routerLink="/layout/tasks"
         routerLinkActive="active"
         class="menu-item">
        <span class="menu-icon">✅</span>
        <span>Tasks</span>
      </a>

    </nav>

    <div class="sidebar-bottom">

      <a routerLink="/layout/profile"
         routerLinkActive="active"
         class="menu-item">
        <span class="menu-icon">👤</span>
        <span>Profile</span>
      </a>

      <a class="menu-item logout" (click)="logout()">
        <span class="menu-icon">🚪</span>
        <span>Logout</span>
      </a>

    </div>

  </aside>

  <!-- MOBILE BOTTOM NAVIGATION (Visible only on mobile <= 768px) -->
  <nav class="mobile-bottom-nav">
    <a routerLink="/layout/dashboard" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Dashboard</span>
    </a>
    <a routerLink="/layout/jobs" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">💼</span>
      <span class="nav-label">Jobs</span>
    </a>
    <a routerLink="/layout/savings" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">💰</span>
      <span class="nav-label">Savings</span>
    </a>
    <a routerLink="/layout/tasks" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">✅</span>
      <span class="nav-label">Tasks</span>
    </a>
    <a routerLink="/layout/profile" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profile</span>
    </a>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
