<div class="app-layout">

  <!-- MOBILE TOPBAR (Visible only on mobile <= 768px) -->
  <header class="mobile-topbar">
    <div class="mobile-logo">
      <div class="logo-icon-badge-sm">✨</div>
      <div class="mobile-logo-text">
        <span class="mobile-brand-title">Niju's Dashboard</span>
      </div>
    </div>
    <button class="mobile-logout-btn" (click)="logout()" title="Logout">
      🚪
    </button>
  </header>

  <!-- DESKTOP SIDEBAR (Visible on screens > 768px) -->
  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon-badge">✨</div>
      <div class="logo-text">
        <h2>Personal<span>App</span></h2>
        <span class="logo-sub">Niju's Dashboard</span>
      </div>
    </div>

    <nav class="menu">

      <a routerLink="/layout/dashboard"
         routerLinkActive="active"
         class="menu-item">
        <span class="menu-icon">🏠</span>
        <span>Dashboard</span>
      </a>

      <a routerLink="/layout/jobs"
         routerLinkActive="active"
         class="menu-item">
        <span class="menu-icon">💼</span>
        <span>Jobs</span>
      </a>

      <a routerLink="/applications"
         routerLinkActive="active"
         class="menu-item">
        <span class="menu-icon">📄</span>
        <span>Applications</span>
      </a>

      <a routerLink="/interviews"
         routerLinkActive="active"
         class="menu-item">
        <span class="menu-icon">🎤</span>
        <span>Interviews</span>
      </a>

      <a routerLink="/tasks"
         routerLinkActive="active"
         class="menu-item">
        <span class="menu-icon">✅</span>
        <span>Tasks</span>
      </a>

    </nav>

    <div class="sidebar-bottom">

      <a routerLink="/profile"
         routerLinkActive="active"
         class="menu-item">
        <span class="menu-icon">👤</span>
        <span>Profile</span>
      </a>

      <a class="menu-item logout" (click)="logout()">
        <span class="menu-icon">🚪</span>
        <span>Logout</span>
      </a>

    </div>

  </aside>

  <!-- MOBILE BOTTOM NAVIGATION (Visible only on mobile <= 768px) -->
  <nav class="mobile-bottom-nav">
    <a routerLink="/layout/dashboard" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Dashboard</span>
    </a>
    <a routerLink="/layout/jobs" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">💼</span>
      <span class="nav-label">Jobs</span>
    </a>
    <a routerLink="/applications" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">📄</span>
      <span class="nav-label">Apps</span>
    </a>
    <a routerLink="/interviews" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">🎤</span>
      <span class="nav-label">Interviews</span>
    </a>
    <a routerLink="/tasks" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">✅</span>
      <span class="nav-label">Tasks</span>
    </a>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
