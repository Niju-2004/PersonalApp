<div class="login-wrapper">
  <!-- Catchy glowing ambient orbs -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="login-container">
    <header class="login-header">
      <div class="brand-badge">
        <span class="badge-sparkle">✨</span>
        <span>Personal Suite</span>
      </div>
      
      <!-- Catchy "Niju's Dashboard" in Red & Violet gradient -->
      <h1 class="dashboard-brand-title">Niju's Dashboard</h1>
      
      <h2 class="welcome-heading">Welcome back</h2>
      <p class="welcome-subtext">Please enter your details to sign in</p>
    </header>

    <!-- Error Alert Banner -->
    <div class="alert alert-error" *ngIf="errorMessage">
      <span class="alert-icon">⚠️</span>
      <span>{{ errorMessage }}</span>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <!-- Email Address -->
      <div class="input-group">
        <label for="email">Email Address</label>
        <div class="input-field-wrapper">
          <span class="field-icon">✉️</span>
          <input type="email"
                 id="email"
                 name="email"
                 [(ngModel)]="email"
                 placeholder="name@example.com"
                 required
                 autocomplete="email">
        </div>
      </div>

      <!-- Password with Eye Toggle -->
      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-field-wrapper">
          <span class="field-icon">🔒</span>
          <input [type]="showPassword ? 'text' : 'password'"
                 id="password"
                 name="password"
                 [(ngModel)]="password"
                 placeholder="••••••••"
                 required
                 autocomplete="current-password">
          <!-- Eye Toggle Button -->
          <button type="button"
                  class="eye-toggle-btn"
                  (click)="togglePasswordVisibility()"
                  [title]="showPassword ? 'Hide password' : 'Show password'">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox" name="remember">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In to Dashboard</span>
        <span *ngIf="isLoading">Signing in...</span>
        <span class="btn-arrow" *ngIf="!isLoading">→</span>
      </button>
    </form>

    <footer class="login-footer">
      <p>Don't have an account? <a routerLink="/userRegistration">Create an account</a></p>
    </footer>
  </main>
</div>
